## SkillsMine Camouflage-style Mock Server Configuration
## Single-domain, role-based access model
## Compatible runner: mock-server/camouflage-runner.js (Node >= 22)

server:
  port: 4000
  mocksDir: "./mock-server/mocks"
  logLevel: "info"      # debug | info | warn | error

delay:
  min: 300              # ms – simulates real network latency
  max: 900              # ms

errorSimulation:
  enabled: true
  rate: 0.02            # 2 % of authenticated requests get a server error

cors:
  enabled: true
  origins: "*"
  headers: "Authorization, Content-Type"
  methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"

auth:
  enabled: true
  publicPaths:
    - /auth/login
    - /auth/signup
    - /jobs
    - /opportunities
    - /candidates/register
  tokenHeader: "Authorization"
  tokenPrefix: "Bearer "

# Roles: candidate | recruiter | manco | admin
# All roles live under theskillsmine.com (single domain)
# Access separation is handled by role-based guards in the runner
roles:
  - candidate
  - recruiter
  - manco
  - admin
