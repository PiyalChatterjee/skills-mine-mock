openapi: 3.0.3
info:
  title: SkillsMine Candidate Service API
  version: 1.0.0-mock
  description: >
    Mock implementation of the deployed Candidate Service contract. Legacy
    candidate, resume, AI-service, and CV-upload routes are intentionally not
    documented or mounted here.
servers:
  - url: http://localhost:4000
    description: Local mock server
security:
  - bearerAuth: []
tags:
  - name: Candidate
    description: Candidate profile, CV, saved jobs, and application operations
  - name: Profile
    description: Candidate profile and landing operations
  - name: Application
    description: Candidate applications and dashboard operations
  - name: Recommendations
    description: Candidate job recommendations
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobProfileId:
      name: jobProfileId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
        code: { type: string }
        requestId: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }
    CandidateLandingResponse:
      type: object
      required: [candidate_id, statistics]
      properties:
        candidate_id: { type: string, format: uuid }
        statistics:
          type: object
          required: [total_applications, successful_applications, in_progress_applications]
          properties:
            total_applications: { type: integer }
            successful_applications: { type: integer }
            in_progress_applications: { type: integer }
    CandidateDashboardResponse:
      type: object
      required: [candidate_id, applications, pagination]
      properties:
        candidate_id: { type: string, format: uuid }
        applications:
          type: array
          items:
            type: object
            required: [application_id, job_profile_id_ref, job_title, current_stage_code, stage_progress]
            properties:
              application_id: { type: string, format: uuid }
              job_profile_id_ref: { type: string, format: uuid }
              job_title: { type: string }
              current_stage_code: { type: string }
              stage_progress: { type: array, items: { type: object, additionalProperties: true } }
        pagination:
          $ref: '#/components/schemas/Pagination'
    CandidatePersonalDetails:
      type: object
      required: [first_name, last_name, email]
      properties:
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        phone_number: { type: string, nullable: true }
        residential_location: { type: string, nullable: true }
        nationality: { type: string, nullable: true }
        race: { type: string, nullable: true }
        gender: { type: string, nullable: true }
        disability_status: { type: string, nullable: true }
        current_company: { type: string, nullable: true }
        current_position: { type: string, nullable: true }
        notice_period: { type: string, nullable: true }
    CandidateProfileResponse:
      type: object
      required: [candidate_id, user_id, personal_details]
      properties:
        candidate_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        personal_details: { $ref: '#/components/schemas/CandidatePersonalDetails' }
        desired_job: { type: object, nullable: true, additionalProperties: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
    CreateCandidateProfile:
      type: object
      required: [personal_details]
      properties:
        personal_details: { $ref: '#/components/schemas/CandidatePersonalDetailsInput' }
        career_history: { type: array, items: { type: object, additionalProperties: true } }
        skills: { type: array, items: { type: object, additionalProperties: true } }
        education: { type: array, items: { type: object, additionalProperties: true } }
        languages: { type: array, items: { type: string } }
    CandidatePersonalDetailsInput:
      type: object
      required: [first_name, last_name]
      properties:
        first_name: { type: string, minLength: 1 }
        last_name: { type: string, minLength: 1 }
        phone_number: { type: string }
        residential_location: { type: string }
        nationality: { type: string }
        race: { type: string }
        gender: { type: string }
        disability_status: { type: string }
        current_company: { type: string }
        current_position: { type: string }
        notice_period: { type: string }
    CvDetailsResponse:
      type: object
      required: [candidate_id, personal_details, career_history, skills, education, languages]
      properties:
        candidate_id: { type: string, format: uuid }
        personal_details: { $ref: '#/components/schemas/CandidatePersonalDetails' }
        career_history: { type: array, items: { type: object, additionalProperties: true } }
        skills: { type: array, items: { type: string } }
        education: { type: array, items: { type: object, additionalProperties: true } }
        languages: { type: array, items: { type: string } }
    CheckCandidateByEmailRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    CheckCandidateByEmailResponse:
      type: object
      properties:
        exists: { type: boolean }
        candidateId: { type: string, format: uuid, nullable: true }
    ApplyToJobRequest:
      type: object
      required: [jobProfileId]
      properties:
        jobProfileId: { type: string, format: uuid }
        sourceChannel: { type: string }
        cvId: { type: string, nullable: true }
    ApplyToJobResponse:
      type: object
      required: [applicationId, jobProfileId, matchScore, status, nextStep]
      properties:
        applicationId: { type: string, format: uuid }
        jobProfileId: { type: string, format: uuid }
        matchScore: { type: integer, minimum: 0, maximum: 100 }
        status: { type: string }
        nextStep: { type: string }
    SavedJobsResponse:
      type: object
      required: [candidate_id, saved_jobs, pagination]
      properties:
        candidate_id: { type: string, format: uuid }
        saved_jobs: { type: array, items: { $ref: '#/components/schemas/SavedJob' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    SavedJob:
      type: object
      properties:
        saved_job_id: { type: string }
        candidate_id: { type: string, format: uuid }
        job_profile_id: { type: string, format: uuid }
        job_title: { type: string }
        job_description: { type: string }
        location: { type: string }
        status: { type: string }
        industry: { type: string, nullable: true }
        current_stage_code: { type: string, nullable: true }
        saved_at: { type: string, format: date-time, nullable: true }
    SaveJobResponse:
      type: object
      required: [saved_job_id, candidate_id, job_profile_id, saved_at, message]
      properties:
        saved_job_id: { type: string }
        candidate_id: { type: string, format: uuid }
        job_profile_id: { type: string, format: uuid }
        saved_at: { type: string, format: date-time }
        message: { type: string }
    UnsaveJobResponse:
      type: object
      required: [candidate_id, job_profile_id, message]
      properties:
        candidate_id: { type: string, format: uuid }
        job_profile_id: { type: string, format: uuid }
        message: { type: string }
    RecommendedPositionsResponse:
      type: object
      required: [candidate_id, recommended_positions, pagination]
      properties:
        candidate_id: { type: string, format: uuid }
        recommended_positions: { type: array, items: { $ref: '#/components/schemas/RecommendedPosition' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    RecommendedPosition:
      type: object
      properties:
        job_profile_id: { type: string, format: uuid }
        job_title: { type: string }
        job_description: { type: string }
        location: { type: string }
        status: { type: string }
        industry: { type: string, nullable: true }
        current_stage_code: { type: string, nullable: true }
        is_saved: { type: boolean }
    Pagination:
      type: object
      required: [current_page, page_size, total_items, total_pages]
      properties:
        current_page: { type: integer }
        page_size: { type: integer }
        total_items: { type: integer }
        total_pages: { type: integer }
paths:
  /candidates/by-email:
    post:
      tags: [Candidate]
      summary: Check whether a candidate exists by email
      operationId: checkCandidateByEmail
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CheckCandidateByEmailRequest' } } }
      responses:
        '200': { description: Candidate existence result, content: { application/json: { schema: { $ref: '#/components/schemas/CheckCandidateByEmailResponse' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /candidates/apply:
    post:
      tags: [Application]
      summary: Apply to a job position
      operationId: applyToJob
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ApplyToJobRequest' } } }
      responses:
        '201': { description: Application created, content: { application/json: { schema: { $ref: '#/components/schemas/ApplyToJobResponse' } } } }
        '403': { description: Candidate profile required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Job not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Duplicate application, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Job is not accepting applications, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /candidates/landing:
    get:
      tags: [Profile]
      summary: Get candidate landing data
      operationId: getCandidateLanding
      responses:
        '200': { description: Landing data, content: { application/json: { schema: { $ref: '#/components/schemas/CandidateLandingResponse' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /candidates/dashboard:
    get:
      tags: [Profile]
      summary: Get candidate dashboard
      operationId: getCandidateDashboard
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200': { description: Candidate dashboard, content: { application/json: { schema: { $ref: '#/components/schemas/CandidateDashboardResponse' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /candidates/cv-build/{candidateId}:
    get:
      tags: [Candidate]
      summary: Get candidate CV details
      operationId: getCandidateCvDetails
      parameters: [{ $ref: '#/components/parameters/CandidateId' }]
      responses:
        '200': { description: Candidate CV details, content: { application/json: { schema: { $ref: '#/components/schemas/CvDetailsResponse' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      tags: [Candidate]
      summary: Create or update candidate CV profile
      operationId: createCandidateCv
      parameters: [{ $ref: '#/components/parameters/CandidateId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateCandidateProfile' } } }
      responses:
        '201': { description: CV profile created, content: { application/json: { schema: { $ref: '#/components/schemas/CvDetailsResponse' } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /candidates/profile/{candidateId}:
    get:
      tags: [Profile]
      summary: Get candidate profile
      operationId: getCandidateProfile
      parameters: [{ $ref: '#/components/parameters/CandidateId' }]
      responses:
        '200': { description: Candidate profile, content: { application/json: { schema: { $ref: '#/components/schemas/CandidateProfileResponse' } } } }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Forbidden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    put:
      tags: [Profile]
      summary: Create or update simple candidate profile
      operationId: updateCandidateProfile
      parameters: [{ $ref: '#/components/parameters/CandidateId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { description: Profile updated, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '400': { description: Validation error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /candidates/{candidateId}/saved-jobs:
    get:
      tags: [Candidate]
      summary: Get candidate saved jobs
      operationId: getCandidateSavedJobs
      parameters:
        - { $ref: '#/components/parameters/CandidateId' }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200': { description: Saved jobs, content: { application/json: { schema: { $ref: '#/components/schemas/SavedJobsResponse' } } } }
  /candidates/{candidateId}/saved-jobs/{jobProfileId}:
    post:
      tags: [Candidate]
      summary: Save a job for a candidate
      operationId: saveCandidateJob
      parameters:
        - { $ref: '#/components/parameters/CandidateId' }
        - { $ref: '#/components/parameters/JobProfileId' }
      responses:
        '201': { description: Job saved, content: { application/json: { schema: { $ref: '#/components/schemas/SaveJobResponse' } } } }
    delete:
      tags: [Candidate]
      summary: Remove a saved job for a candidate
      operationId: removeCandidateJob
      parameters:
        - { $ref: '#/components/parameters/CandidateId' }
        - { $ref: '#/components/parameters/JobProfileId' }
      responses:
        '200': { description: Job removed, content: { application/json: { schema: { $ref: '#/components/schemas/UnsaveJobResponse' } } } }
  /candidates/{candidateId}/recommended-positions:
    get:
      tags: [Recommendations]
      summary: Get recommended positions for a candidate
      operationId: getRecommendedPositions
      parameters:
        - { $ref: '#/components/parameters/CandidateId' }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200': { description: Recommended positions, content: { application/json: { schema: { $ref: '#/components/schemas/RecommendedPositionsResponse' } } } }
  /candidates/{candidateId}/ai-actions:
    get:
      tags: [Candidate]
      summary: Get candidate AI actions
      operationId: getCandidateAiActions
      parameters: [{ $ref: '#/components/parameters/CandidateId' }]
      responses:
        '200': { description: AI actions, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
