openapi: 3.0.3
info:
  title: SkillsMine Auth Service API
  version: "3.0.0-mock"
  description: >
    Mock implementation of the backend Auth Service v3 contract. All routes are
    exposed through the API gateway prefix /api/auth-service/v1. The retired
    /auth and /api/v1/auth endpoints are intentionally not mounted.
servers:
  - url: http://localhost:4000
    description: SkillsMine mock server
security:
  - BearerAuth: []
tags:
  - name: Authentication
  - name: Candidate Registration
  - name: Staff Profile Management
  - name: Staff Invitations
  - name: Current User
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required: [success, statusCode, message]
      properties:
        success: { type: boolean, example: false }
        statusCode: { type: integer, example: 400 }
        message: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: admin@skillsmine.com }
        password: { type: string, format: password, example: Password123 }
    LoginResponse:
      type: object
      required: [accessToken, idToken, refreshToken, expiresIn, tokenType, isFirstLogin]
      properties:
        accessToken: { type: string }
        idToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, format: int32, example: 3600 }
        tokenType: { type: string, example: Bearer }
        isFirstLogin: { type: boolean }
    CandidateRegistrationRequest:
      type: object
      required: [firstName, lastName, email, mobileNumber, password]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        mobileNumber: { type: string, example: "+27821234567" }
        password: { type: string, format: password }
        visitorId: { type: string, format: uuid }
    VisitorConversionRequest:
      allOf:
        - $ref: '#/components/schemas/CandidateRegistrationRequest'
        - type: object
          required: [visitorId]
    GoogleRegistrationRequest:
      type: object
      required: [idToken]
      properties:
        idToken: { type: string, description: Google OpenID Connect ID token }
    CandidateRegistrationResponse:
      type: object
      required: [userId, email, role, registrationType, accountStatus]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [JOB_SEEKER] }
        registrationType: { type: string, enum: [SELF_SERVICE] }
        accountStatus: { type: string, example: ACTIVE }
    StaffRegistrationRequest:
      type: object
      required: [invitationToken, staffNumber, email, firstName, lastName, password]
      properties:
        invitationToken: { type: string, format: uuid }
        staffNumber: { type: string }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        password: { type: string, format: password }
    StaffRegistrationResponse:
      type: object
      properties:
        userId: { type: string, format: uuid }
        staffNumber: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [RECRUITER, MANCO, EXCO, ADMIN] }
        accountStatus: { type: string, example: ACTIVE }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [newPassword]
      properties:
        email: { type: string, format: email }
        confirmationCode: { type: string }
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password }
    MessageResponse:
      type: object
      additionalProperties: { type: string }
      example: { message: Password has been reset successfully. }
    TokenValidationResponse:
      type: object
      required: [valid]
      additionalProperties: { type: boolean }
      properties:
        valid: { type: boolean, example: true }
    StaffProfileListDto:
      type: object
      required: [staffId, userId, staffNumber, primaryEmail, firstName, lastName, roleCode, registrationStatus, employmentStatus, createdAt, updatedAt]
      properties:
        staffId: { type: string, format: uuid }
        userId: { type: string }
        staffNumber: { type: string }
        primaryEmail: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        roleCode: { type: string, enum: [RECRUITER, MANCO, EXCO, ADMIN] }
        registrationStatus: { type: string, example: PENDING }
        employmentStatus: { type: string, example: ACTIVE }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AddStaffProfileRequest:
      type: object
      required: [staffNumber, primaryEmail, roleCode, firstName, lastName]
      properties:
        staffNumber: { type: string, maxLength: 80 }
        primaryEmail: { type: string, format: email, maxLength: 500 }
        roleCode: { type: string, enum: [RECRUITER, MANCO, EXCO, ADMIN] }
        firstName: { type: string, maxLength: 120 }
        lastName: { type: string, maxLength: 120 }
    AddStaffProfileResponse:
      type: object
      properties:
        staffId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        staffNumber: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        roleCode: { type: string, enum: [RECRUITER, MANCO, EXCO, ADMIN] }
        employmentStatus: { type: string, example: ACTIVE }
    SendStaffInvitationRequest:
      type: object
      required: [email, staffNumber]
      properties:
        email: { type: string, format: email }
        staffNumber: { type: string }
    SendStaffInvitationResponse:
      type: object
      properties:
        invitationId: { type: string, format: uuid }
        email: { type: string, format: email }
        staffNumber: { type: string }
        expiresAt: { type: string, format: date-time }
        message: { type: string }
    CurrentUserResponse:
      type: object
      properties:
        userId: { type: string }
        email: { type: string, format: email }
        provider: { type: string, enum: [LOCAL, GOOGLE, MICROSOFT] }
        roles:
          type: array
          items: { type: string, enum: [JOB_SEEKER, RECRUITER, MANCO, EXCO, ADMIN] }
        staffProfile:
          type: object
          nullable: true
          properties:
            staffNumber: { type: string }
            firstName: { type: string }
            lastName: { type: string }
            employmentStatus: { type: string }
        candidateId: { type: string }
        accountStatus: { type: string }
paths:
  /api/auth-service/v1/users/validate:
    post:
      tags: [Current User]
      summary: Validate the supplied bearer token
      operationId: validateToken
      security: []
      responses:
        '200': { description: Token validation result, content: { application/json: { schema: { $ref: '#/components/schemas/TokenValidationResponse' } } } }
  /api/auth-service/v1/staff/profiles:
    get:
      tags: [Staff Profile Management]
      summary: List staff profiles
      operationId: getAllStaffProfiles
      responses:
        '200': { description: Staff profiles, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StaffProfileListDto' } } } } }
        '403': { description: ADMIN role required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    post:
      tags: [Staff Profile Management]
      summary: Create a staff profile
      operationId: createStaffProfile
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AddStaffProfileRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AddStaffProfileResponse' } } } }
        '400': { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: ADMIN role required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: Staff profile exists, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/auth-service/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Log in with email and password
      operationId: login
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '400': { description: Missing credentials, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { description: Invalid credentials, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: Account inactive, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/auth-service/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Invalidate the current session
      operationId: logout
      responses:
        '204': { description: No Content }
  /api/auth-service/v1/auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request a password reset confirmation code
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ForgotPasswordRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } } }
        '400': { description: Missing email, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/auth-service/v1/auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset or change a password
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ResetPasswordRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } } }
        '400': { description: Invalid reset request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/auth-service/v1/auth/candidates/register:
    post:
      tags: [Candidate Registration]
      summary: Register a candidate
      operationId: registerCandidate
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CandidateRegistrationRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CandidateRegistrationResponse' } } } }
        '400': { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: Email exists, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/auth-service/v1/auth/candidates/register/visitor/conversion:
    post:
      tags: [Candidate Registration]
      summary: Convert a visitor into a candidate
      operationId: registerVisitorConversion
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VisitorConversionRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CandidateRegistrationResponse' } } } }
        '400': { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: Visitor not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: Email exists, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/auth-service/v1/auth/candidates/register-google:
    post:
      tags: [Candidate Registration]
      summary: Register a candidate with Google
      operationId: registerGoogle
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GoogleRegistrationRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CandidateRegistrationResponse' } } } }
        '400': { description: Missing ID token, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/auth-service/v1/auth/staff/register:
    post:
      tags: [Staff Invitations]
      summary: Register invited staff
      operationId: registerStaff
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StaffRegistrationRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/StaffRegistrationResponse' } } } }
        '400': { description: Invalid invitation or request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: Email exists, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/auth-service/v1/admin/staff-invitations/send:
    post:
      tags: [Staff Invitations]
      summary: Send a staff registration invitation
      operationId: sendInvitation
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SendStaffInvitationRequest' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SendStaffInvitationResponse' } } } }
        '400': { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '403': { description: ADMIN role required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: Staff profile not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/auth-service/v1/users/me:
    get:
      tags: [Current User]
      summary: Get the current authenticated user
      operationId: getMe
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CurrentUserResponse' } } } }
        '401': { description: Not authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: User not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }