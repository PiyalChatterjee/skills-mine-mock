openapi: 3.0.3
info:
  title: SkillsMine Mandate Service
  version: 3.0.0
  description: Mock implementation aligned with Mandate_Service_v3.yaml.
servers:
  - url: http://localhost:4000
    description: Local mock server
security:
  - BearerAuth: []
tags:
  - name: Jobs
  - name: Reference Data
paths:
  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - name: industryId
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, format: uuid }
        - name: locationText
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - name: datePosted
          in: query
          schema: { type: string, enum: [TODAY, LAST_3_DAYS, LAST_7_DAYS, LAST_14_DAYS, LAST_30_DAYS] }
        - name: jobType
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/EmploymentType' }
        - { name: clientId, in: query, schema: { type: string, format: uuid } }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/JobStatus' }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Paginated jobs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobProfilePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Jobs]
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateJobRequest' }
      responses:
        '201':
          description: Created draft job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /jobs/{jobProfileId}:
    parameters:
      - { $ref: '#/components/parameters/jobProfileId' }
    get:
      tags: [Jobs]
      operationId: getJob
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobProfileDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Jobs]
      operationId: patchJob
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchJobRequest' }
      responses:
        '200':
          description: Updated job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobProfileWithSkills' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /jobs/{jobProfileId}/view:
    patch:
      tags: [Jobs]
      operationId: incrementJobViewCount
      parameters:
        - { $ref: '#/components/parameters/jobProfileId' }
      responses:
        '200':
          description: Updated view count
          content:
            application/json:
              schema:
                type: object
                required: [viewCount]
                properties:
                  viewCount: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Jobs]
      operationId: deleteJob
      responses:
        '204': { description: Job cancelled or deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /industries:
    get:
      tags: [Reference Data]
      operationId: listIndustries
      parameters:
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200':
          description: Active industries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IndustryItem' }
  /locations:
    get:
      tags: [Reference Data]
      operationId: listLocations
      parameters:
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200':
          description: Alphabetically sorted distinct job locations
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /companies:
    get:
      tags: [Reference Data]
      operationId: listCompanies
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Paginated companies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyPage' }
  /candidates:
    get:
      tags: [Jobs]
      operationId: listCandidates
      parameters:
        - { name: companyName, in: query, schema: { type: string } }
        - { name: locationText, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: jobProfileId, in: query, schema: { type: string, format: uuid } }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CandidateStatus' }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Paginated candidates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidatePage' }
components:
  securitySchemes:
    BearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    jobProfileId:
      name: jobProfileId
      in: path
      required: true
      description: UUID of the job profile
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Validation error
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: Version or uniqueness conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    UnprocessableEntity:
      description: Business rule violation
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    EmploymentType: { type: string, enum: [FULL_TIME, PART_TIME, CONTRACT, TEMPORARY, INTERNSHIP, FREELANCE] }
    WorkType: { type: string, enum: [REMOTE, HYBRID, ONSITE], nullable: true }
    JobStatus: { type: string, enum: [DRAFT, POSTED, PAUSED, FILLED, CANCELLED, CLOSED] }
    CandidateStatus: { type: string, enum: [SUBMITTED, ACTIVE, ON_HOLD, CLOSED, CANCELLED, REJECTED, APPLIED], nullable: true }
    IndustryItem:
      type: object
      properties:
        industryId: { type: string, format: uuid }
        industryName: { type: string }
        normalizedKey: { type: string }
    CompanyItem:
      type: object
      required: [clientId, clientName]
      properties:
        clientId: { type: string, format: uuid }
        clientName: { type: string }
        contactName: { type: string }
        contactEmail: { type: string, format: email }
        contactPhoneNumber: { type: string }
        clientRate: { type: number, format: double, nullable: true }
    Page:
      type: object
      required: [total, page, size]
      properties:
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }
    CompanyPage:
      allOf:
        - { $ref: '#/components/schemas/Page' }
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/CompanyItem' } }
    JobSkillSummary:
      type: object
      properties:
        skillId: { type: string, format: uuid, nullable: true }
        originalText: { type: string, nullable: true }
        sourceType: { type: string, enum: [AI_GENERATED, RECRUITER_ENTERED] }
    JobProfileSummary:
      type: object
      properties:
        jobProfileId: { type: string, format: uuid }
        jobReferenceNumber: { type: string }
        client: { $ref: '#/components/schemas/CompanyItem', nullable: true }
        positionTitle: { type: string }
        industry: { $ref: '#/components/schemas/IndustryItem', nullable: true }
        locationText: { type: string }
        employmentType: { $ref: '#/components/schemas/EmploymentType', nullable: true }
        jobDescriptionSnippet: { type: string, nullable: true }
        fillByDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/JobStatus' }
        publishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    JobProfile:
      allOf:
        - { $ref: '#/components/schemas/JobProfileSummary' }
        - type: object
          properties:
            workType: { $ref: '#/components/schemas/WorkType' }
            experienceLevel: { type: string, nullable: true }
            priority: { type: string, enum: [LOW, NORMAL, HIGH, CRITICAL] }
            salaryMin: { type: number, nullable: true }
            salaryMax: { type: number, nullable: true }
            currencyCode: { type: string, default: ZAR }
            clientRate: { type: number, format: double, nullable: true }
            jobDescription: { type: string, nullable: true }
            requirements: { type: array, items: { type: string } }
            responsibilities: { type: array, items: { type: string } }
            benefitsText: { type: array, items: { type: string } }
            closedAt: { type: string, format: date-time, nullable: true }
            createdByUserId: { type: string, format: uuid }
            versionNo: { type: integer }
    JobProfileDetail:
      allOf:
        - { $ref: '#/components/schemas/JobProfile' }
        - type: object
          properties:
            skills: { type: array, items: { $ref: '#/components/schemas/JobSkillSummary' } }
            viewCount: { type: integer }
            applicantCount: { type: integer }
            daysLeftToFill: { type: integer, nullable: true }
    JobProfileWithSkills:
      allOf:
        - { $ref: '#/components/schemas/JobProfile' }
        - type: object
          properties:
            skills: { type: array, items: { $ref: '#/components/schemas/JobSkillSummary' } }
    JobProfilePage:
      allOf:
        - { $ref: '#/components/schemas/Page' }
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/JobProfileSummary' } }
    CandidateRow:
      type: object
      properties:
        applicationId: { type: string, format: uuid, nullable: true }
        candidateId: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        fullName: { type: string }
        title: { type: string }
        companyName: { type: string }
        locationText: { type: string }
        matchPercentage: { type: number, minimum: 0, maximum: 100, nullable: true }
        status: { $ref: '#/components/schemas/CandidateStatus' }
        jobProfileId: { type: string, format: uuid, nullable: true }
    CandidatePage:
      allOf:
        - { $ref: '#/components/schemas/Page' }
        - type: object
          properties:
            data: { type: array, items: { $ref: '#/components/schemas/CandidateRow' } }
    AddJobSkillRequest:
      type: object
      properties:
        skillId: { type: string, format: uuid }
        originalText: { type: string }
        sourceType: { type: string, enum: [AI_GENERATED, RECRUITER_ENTERED] }
    JobWriteFields:
      type: object
      properties:
        status: { $ref: '#/components/schemas/JobStatus' }
        jobReferenceNumber: { type: string }
        companyName: { type: string }
        contactName: { type: string }
        contactEmail: { type: string, format: email }
        contactPhoneNumber: { type: string }
        positionTitle: { type: string }
        locationText: { type: string }
        fillByDate: { type: string, format: date }
        workType: { $ref: '#/components/schemas/WorkType' }
        employmentType: { $ref: '#/components/schemas/EmploymentType' }
        experienceLevel: { type: string, nullable: true }
        priority: { type: string, enum: [LOW, NORMAL, HIGH, CRITICAL], default: NORMAL }
        salaryMin: { type: number, minimum: 0, nullable: true }
        salaryMax: { type: number, minimum: 0, nullable: true }
        currencyCode: { type: string, default: ZAR }
        clientRate: { type: number, minimum: 0, nullable: true }
        jobDescription: { type: string, nullable: true }
        benefitsText: { type: array, items: { type: string } }
        requirements: { type: array, items: { type: string } }
        responsibilities: { type: array, items: { type: string } }
        industryId: { type: string, format: uuid, nullable: true }
        skills: { type: array, items: { $ref: '#/components/schemas/AddJobSkillRequest' } }
    CreateJobRequest:
      allOf:
        - { $ref: '#/components/schemas/JobWriteFields' }
        - type: object
          required: [companyName, contactName, contactEmail, contactPhoneNumber, positionTitle, fillByDate, clientRate]
    PatchJobRequest:
      allOf:
        - { $ref: '#/components/schemas/JobWriteFields' }
    ErrorResponse:
      type: object
      properties:
        message: { type: string }
        code: { type: string }
        requestId: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }